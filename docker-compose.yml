version: "3.9"

services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: ai_math_tutor_livekit
    restart: unless-stopped
    ports:
      - "7880:7880"     # WebSocket & HTTP
      - "7881:7881"     # WebRTC TCP
      - "7882:7882/udp" # WebRTC UDP
      - "3478:3478/udp" # TURN relay UDP
      - "30000-30100:30000-30100/udp" # TURN media relay range
    environment:
      - "LIVEKIT_KEYS=devkey: secret"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml

  postgres:
    image: postgres:16-alpine
    container_name: ai_math_tutor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: math_tutor
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d math_tutor"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
